name: Check and deploy

# Every push and PR: unit tests → build → validate → 390 px browser test.
# Push to main: deploy dist/ to Cloudflare Workers Static Assets, then send only the changed URLs to IndexNow.
# Secrets (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. See README.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Send every URL to IndexNow (after changing the key)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Browser test at 390 px
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Save the live IndexNow manifest (what was deployed before)
        run: curl -fsS https://simplystylo.com/indexnow-manifest.json -o prev-manifest.json || echo '{}' > prev-manifest.json
      - name: Deploy to Cloudflare
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.20.0'
          command: deploy
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "::warning::Cloudflare secrets not set; deploy and IndexNow skipped."
      - name: Send changed URLs to IndexNow
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs ${{ inputs.indexnow_all && '--all' || 'prev-manifest.json' }}
