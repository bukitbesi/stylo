name: Check and IndexNow

# Every push and PR: unit tests → build → validate → 390 px browser test.
# Push to main: Cloudflare Workers Builds deploys the site; the indexnow job then pings only the changed URLs.
# Optional secret GOOGLE_SERVICE_ACCOUNT_JSON (service-account key JSON) also pings the Google Indexing API.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Send every URL to IndexNow (after changing the key)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Browser test at 390 px
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs

  # Cloudflare Workers Builds (Worker "stylo", connected in the Cloudflare dashboard) deploys every push to main.
  # This job only waits until that build is live, then sends the URLs whose content changed to IndexNow.
  indexnow:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Build the previous commit for comparison
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo '{}' > prev-manifest.json
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git worktree add -q ../prev "$BEFORE"
            if (cd ../prev && node scripts/build.mjs > /dev/null 2>&1); then cp ../prev/dist/indexnow-manifest.json prev-manifest.json; fi
          fi
      - name: Wait until Cloudflare serves this build
        run: |
          node -e "
            const want = JSON.stringify(require('./dist/indexnow-manifest.json'));
            (async () => {
              for (let i = 0; i < 30; i++) {
                const live = await fetch('https://simplystylo.com/indexnow-manifest.json?v=' + Date.now()).then((r) => r.ok ? r.json() : null).catch(() => null);
                if (live && JSON.stringify(live) === want) { console.log('Live site matches this build.'); return; }
                await new Promise((r) => setTimeout(r, 30e3));
              }
              console.log('::warning::Live site did not match this build within 15 minutes; IndexNow skipped.');
              process.exit(1);
            })();
          "
      - name: Send changed URLs to IndexNow
        run: node scripts/indexnow.mjs ${{ inputs.indexnow_all && '--all' || 'prev-manifest.json' }}
      # Best-effort: Google's Indexing API officially covers only JobPosting/livestream pages, so a failure here
      # must never fail the deploy. Skipped silently until the GOOGLE_SERVICE_ACCOUNT_JSON secret exists.
      - name: Notify Google Indexing API
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret not set; Google ping skipped."
          else
            node scripts/ping-google.mjs ${{ inputs.indexnow_all && '--all' || 'prev-manifest.json' }}
          fi
